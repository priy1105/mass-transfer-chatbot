[project]
name = "mass-transfer-chatbot"
version = "0.2.0"
description = "A textbook-grounded mass transfer study workspace for Streamlit Cloud"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "streamlit>=1.66.1,<1.67",
    "groq>=0.29,<1",
    "pypdf>=5.7,<7",
    "scikit-learn>=1.7,<2",
    "python-dotenv>=1.1,<2",
    "pillow>=11.3,<14",
    "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
